name: Windows title bar check
on:
  workflow_dispatch:
  push:
    branches: ["claude/dark-title-bar"]

permissions:
  contents: write  # the screenshots are also pushed to the ci/titlebar-shots branch

jobs:
  titlebar:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Install ORION
        run: python -m pip install -U pip && pip install -e .
      - name: Before (base branch)
        shell: pwsh
        env: { PYTHONIOENCODING: utf-8 }
        run: |
          git checkout origin/claude/exciting-babbage-nm551l -- orion
          python scripts/titlebar_check.py --before
          git checkout ${{ github.sha }} -- orion
      - name: After (this branch)
        env: { PYTHONIOENCODING: utf-8 }
        run: python scripts/titlebar_check.py
      - uses: actions/upload-artifact@v5
        if: always()
        with: { name: titlebar, path: titlebar/ }
      - name: Publish screenshots to the ci/titlebar-shots branch
        if: always()
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          Copy-Item -Recurse titlebar $env:RUNNER_TEMP\shots
          git checkout --orphan ci/titlebar-shots
          git rm -rfq --cached .
          Remove-Item -Recurse -Force titlebar
          Copy-Item -Recurse $env:RUNNER_TEMP\shots titlebar
          git add titlebar
          git commit -qm "Title bar screenshots for ${{ github.sha }}"
          git push -f origin ci/titlebar-shots
