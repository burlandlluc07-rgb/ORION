name: Release (Windows installer)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: ui/package-lock.json }
      - name: Build UI
        working-directory: ui
        run: npm ci && npm run build
      - name: Install
        run: python -m pip install -U pip && pip install -e ".[dev,docs]"
      - name: Test
        run: python -m pytest -q
      - name: Freeze
        run: pyinstaller packaging/orion.spec --noconfirm --distpath dist --workpath build
      - name: Installer
        shell: pwsh
        run: |
          $ver = (python -c "import orion; print(orion.__version__)")
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" packaging\installer.iss
      - uses: actions/upload-artifact@v4
        with: { name: ORION-Windows, path: "dist/ORION-Setup-*.exe" }
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: "dist/ORION-Setup-*.exe" }
