name: Release (Windows installer)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: ui/package-lock.json }
      - name: Build UI
        working-directory: ui
        run: npm ci && npm run build
      - name: Install
        run: python -m pip install -U pip && pip install -e ".[dev,docs]"
      - name: Test
        run: python -m pytest -q
      - name: Freeze
        run: pyinstaller packaging/orion.spec --noconfirm --distpath dist --workpath build
      - name: Smoke-test the frozen app
        shell: pwsh
        run: |
          $env:ORION_HOME = "$env:RUNNER_TEMP\orion-smoke"
          $env:GEMINI_API_KEY = "smoke-test-key"
          $p = Start-Process dist\ORION\ORION.exe -ArgumentList "--headless","--port","8799" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 1
            if (Test-Path "$env:ORION_HOME\instance.json") {
              $info = Get-Content "$env:ORION_HOME\instance.json" | ConvertFrom-Json
              try {
                $state = Invoke-RestMethod -Uri "http://127.0.0.1:8799/api/state" -Headers @{ "x-orion-token" = $info.token }
                $chat = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8799/api/chat" -ContentType "application/json" `
                  -Headers @{ "x-orion-token" = $info.token } -Body '{"text":"what time is it"}'
                Start-Sleep -Seconds 2
                $conv = Invoke-RestMethod -Uri "http://127.0.0.1:8799/api/conversations/$($chat.conv_id)" -Headers @{ "x-orion-token" = $info.token }
                $tools = Invoke-RestMethod -Uri "http://127.0.0.1:8799/api/tools" -Headers @{ "x-orion-token" = $info.token }
                $ui = Invoke-WebRequest -Uri "http://127.0.0.1:8799/" -UseBasicParsing
                Write-Host "version $($state.version); $($tools.Count) tools; reply: $($conv.messages[-1].content); UI $($ui.StatusCode)"
                if ($conv.messages.Count -ge 2 -and $ui.StatusCode -eq 200) { $ok = $true }
                break
              } catch { Write-Host "waiting: $_" }
            }
          }
          Get-Content "$env:ORION_HOME\logs\orion.log" -ErrorAction SilentlyContinue | Select-Object -Last 40
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "Frozen ORION.exe failed the smoke test" }
      - name: Installer
        shell: pwsh
        run: |
          $ver = (python -c "import orion; print(orion.__version__)")
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" packaging\installer.iss
      - uses: actions/upload-artifact@v4
        with: { name: ORION-Windows, path: "dist/ORION-Setup-*.exe" }
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: "dist/ORION-Setup-*.exe" }
