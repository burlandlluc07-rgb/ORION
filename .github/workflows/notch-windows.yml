name: Windows notch check
on:
  workflow_dispatch:
  push:
    branches: ["feature/notch-ui"]

permissions:
  contents: write  # the screenshots are also pushed to the ci/notch-shots branch

jobs:
  notch:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Install ORION
        run: python -m pip install -U pip && pip install -e .
      - name: Notch
        env: { PYTHONIOENCODING: utf-8 }
        run: python scripts/notch_check.py
      - uses: actions/upload-artifact@v5
        if: always()
        with: { name: notch, path: notch/ }
      - name: Publish screenshots to the ci/notch-shots branch
        if: always()
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          Copy-Item -Recurse notch $env:RUNNER_TEMP\shots
          git checkout --orphan ci/notch-shots
          git rm -rfq --cached .
          Remove-Item -Recurse -Force notch
          Copy-Item -Recurse $env:RUNNER_TEMP\shots notch
          git add notch
          git commit -qm "Notch screenshots for ${{ github.sha }}"
          git push -f origin ci/notch-shots
