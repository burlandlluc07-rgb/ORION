name: Windows end-to-end (installed app)
on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v5
        with: { node-version: "20", cache: npm, cache-dependency-path: ui/package-lock.json }
      - name: Build UI
        working-directory: ui
        run: npm ci && npm run build
      - name: Install build deps
        run: python -m pip install -U pip && pip install -e ".[dev,docs]"
      - name: Freeze
        run: pyinstaller packaging/orion.spec --noconfirm --distpath dist --workpath build
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\installer.iss
      - name: Install ORION like a user (silent installer)
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\ORION-Setup-*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          Get-Item "$env:LOCALAPPDATA\Programs\ORION\ORION.exe"
      - name: Run end-to-end scenarios
        shell: pwsh
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          if ($env:GEMINI_API_KEY) { Write-Host "Gemini key received: yes ($($env:GEMINI_API_KEY.Length) chars)" } else { Write-Host "Gemini key received: NO - add a repository secret named GEMINI_API_KEY under Settings > Secrets and variables > Actions" }
          $env:ORION_HOME = "$env:RUNNER_TEMP\orion-e2e"
          python scripts/e2e_windows.py
      - uses: actions/upload-artifact@v5
        if: always()
        with: { name: e2e-report, path: e2e/ }
