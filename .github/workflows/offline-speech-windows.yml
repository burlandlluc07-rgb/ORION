name: Offline speech (Windows)
on:
  workflow_dispatch:
  push:
    branches: ["feature/offline-speech"]

jobs:
  speech:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v5
        with: { node-version: "20", cache: npm, cache-dependency-path: ui/package-lock.json }
      - name: Install ORION
        run: python -m pip install -U pip && pip install -e ".[dev]"
      - name: Download the model like Settings does, then transcribe Windows' voice (wake, commands, yes/no)
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/offline_stt_check.py --models "$env:RUNNER_TEMP\orion-models"
      - name: Idle CPU and memory with the model loaded
        shell: pwsh
        run: |
          python -c "import os,time,psutil; from pathlib import Path; from orion.voice.offline_stt import ModelStore, load; p=psutil.Process(); r=load(ModelStore(Path(os.environ['RUNNER_TEMP'])/'orion-models')); p.cpu_percent(); time.sleep(10); print(f'idle CPU {p.cpu_percent():.1f}% (of one core), RAM {p.memory_info().rss/1e6:.0f} MB')"
      - name: Build UI
        working-directory: ui
        run: npm ci && npm run build
      - name: Freeze
        run: pyinstaller packaging/orion.spec --noconfirm --distpath dist --workpath build
      - name: The frozen app can load the speech engine
        shell: pwsh
        run: |
          $env:ORION_HOME = "$env:RUNNER_TEMP\orion-frozen"
          $env:GEMINI_API_KEY = "smoke-test-key"
          $p = Start-Process dist\ORION\ORION.exe -ArgumentList "--headless","--port","8798" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 1
            if (Test-Path "$env:ORION_HOME\instance.json") {
              $info = Get-Content "$env:ORION_HOME\instance.json" | ConvertFrom-Json
              try {
                $s = Invoke-RestMethod -Uri "http://127.0.0.1:8798/api/offline-speech" -Headers @{ "x-orion-token" = $info.token }
                Write-Host ($s | ConvertTo-Json -Compress)
                $ok = $s.runtime -eq $true
                break
              } catch { Write-Host "waiting: $_" }
            }
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "The frozen ORION.exe can't load sherpa-onnx" }
      - name: Installer size with and without the speech runtime
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=with" packaging\installer.iss | Out-Null
          $rt = Get-ChildItem -Recurse dist\ORION -Directory -Filter sherpa_onnx | Select-Object -First 1
          $rtMB = (Get-ChildItem -Recurse $rt.FullName -File | Measure-Object Length -Sum).Sum / 1MB
          $appMB = (Get-ChildItem -Recurse dist\ORION -File | Measure-Object Length -Sum).Sum / 1MB
          Remove-Item -Recurse -Force $rt.FullName
          & $iscc "/DAppVersion=without" packaging\installer.iss | Out-Null
          $with = (Get-Item dist\ORION-Setup-with.exe).Length / 1MB
          $without = (Get-Item dist\ORION-Setup-without.exe).Length / 1MB
          $line = "Installed app {0:N1} MB, of which sherpa-onnx {1:N1} MB. Installer {2:N1} MB with it, {3:N1} MB without (+{4:N1} MB)." -f $appMB, $rtMB, $with, $without, ($with - $without)
          Write-Host $line
          "### Size`n$line" >> $env:GITHUB_STEP_SUMMARY
