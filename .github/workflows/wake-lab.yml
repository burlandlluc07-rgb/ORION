name: Wake word lab (Windows speech)
on:
  workflow_dispatch:

jobs:
  lab:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Run wake-word grammar experiments
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\wake_lab.ps1
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Install ORION
        run: python -m pip install -e .
      - name: Wake word, instant commands, offline dictation/voice and screen context on real Windows
        run: python scripts/wake_check.py
