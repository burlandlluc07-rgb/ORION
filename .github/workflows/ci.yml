name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v5
        with: { node-version: "20", cache: npm, cache-dependency-path: ui/package-lock.json }
      - name: Build UI
        working-directory: ui
        run: npm ci && npm run build
      - name: Install
        run: python -m pip install -U pip && pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest -q
      - name: Live Gemini check (runs only when the GEMINI_API_KEY secret is set)
        if: matrix.os == 'ubuntu-latest'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Backup brain check off for now (Lluc, 2026-10-25): the stored key is rejected and isn't needed.
          # To turn it back on, restore these three lines:
          # ORION_BACKUP_API_KEY: ${{ secrets.ORION_BACKUP_API_KEY }}
          # ORION_BACKUP_PROVIDER: ${{ vars.ORION_BACKUP_PROVIDER }}
          # ORION_BACKUP_MODEL: ${{ vars.ORION_BACKUP_MODEL }}
        run: python scripts/live_check.py
