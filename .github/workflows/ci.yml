name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: ui/package-lock.json }
      - name: Build UI
        working-directory: ui
        run: npm ci && npm run build
      - name: Install
        run: python -m pip install -U pip && pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest -q
      - name: Live Gemini check (runs only when the GEMINI_API_KEY secret is set)
        if: matrix.os == 'ubuntu-latest'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/live_check.py
